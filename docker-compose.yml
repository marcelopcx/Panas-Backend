services:
  db:
    image: postgres:16-alpine
    container_name: panas_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: panas
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: panas
    ports:
      # 5433 para no chocar con Game World (5432)
      - "5433:5432"
    volumes:
      - panas_postgres_data:/var/lib/postgresql/data
      - ./db/panas.sql:/docker-entrypoint-initdb.d/01-panas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panas -d panas"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  panas_postgres_data:
