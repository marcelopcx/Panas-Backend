services:
  db:
    image: postgres:16-alpine
    container_name: panas_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: panas
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: panas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Se ejecuta solo la primera vez que se crea el volumen (BD vacía).
      - ./db/panas.sql:/docker-entrypoint-initdb.d/01-panas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panas -d panas"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
