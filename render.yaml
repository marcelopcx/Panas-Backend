# Render Blueprint — Panas Backend
# Repo: https://github.com/marcelopcx/Panas-Backend
#
# 1. En Render: New → Blueprint → conectar este repo
# 2. DATABASE_URL = connection string de Supabase (SSL)
# 3. Aplicar esquema una vez: psql "$DATABASE_URL" -f db/panas.sql

services:
  - type: web
    name: panas-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_HOURS
        value: "24"
      - key: HOST
        value: 0.0.0.0
      # Render inyecta PORT automáticamente; no fijar 8080
      - key: CLOUDINARY_CLOUD_NAME
        value: mpc-uru
      - key: CLOUDINARY_UPLOAD_PRESET
        value: n3n6sbhv
      - key: CLOUDINARY_FOLDER
        value: panas
      - key: DEFAULT_AVATAR_URL
        value: https://res.cloudinary.com/mpc-uru/image/upload/panas/avatars/default.jpg
